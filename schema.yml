  /api/students/admin/student-document-management/:
    get:
      operationId: students_admin_student_document_management_list
      description: |-
        ViewSet for Secretaria/administrative staff to manage student documents.
        Focuses on validating documents by updating their `validation_status` and `notes`.

        **Permissions:** Requires admin user status (or specific 'Secretaria' group).

        **Supported Actions:**
        - `list`: Retrieves a list of student documents. Supports filtering by `validation_status`, `document_type`, and `student` (student ID).
        - `retrieve`: Gets details of a specific student document.
        - `partial_update` (PATCH): Updates the `validation_status` and/or `notes` of a document.
          Refer to `StudentDocumentSerializer` for updatable fields.

        Creation (POST), full update (PUT), and deletion (DELETE) of documents are typically handled
        during pre-registration or other dedicated document upload processes.
      parameters:
      - in: query
        name: document_type
        schema:
          type: string
          enum:
          - CARTEIRA_VACINACAO
          - COMP_RESIDENCIA_RESP
          - CPF_ALUNO
          - CPF_RESPONSAVEL
          - DECLARACAO_QUITACAO_ESCOLA_ANT
          - FOTO_3X4
          - HIST_ESCOLAR
          - LAUDO_MEDICO
          - OUTRO
          - RG_ALUNO
          - RG_RESPONSAVEL
        description: |-
          Tipo do documento.

          * `RG_ALUNO` - RG do Aluno
          * `CPF_ALUNO` - CPF do Aluno
          * `COMP_RESIDENCIA_RESP` - Comprovante de Residência do Responsável
          * `CARTEIRA_VACINACAO` - Carteira de Vacinação
          * `HIST_ESCOLAR` - Histórico Escolar da Escola Anterior
          * `LAUDO_MEDICO` - Laudo Médico (para necessidades especiais)
          * `FOTO_3X4` - Foto 3x4 Recente
          * `RG_RESPONSAVEL` - RG do Responsável
          * `CPF_RESPONSAVEL` - CPF do Responsável
          * `DECLARACAO_QUITACAO_ESCOLA_ANT` - Declaração de Quitação da Escola Anterior
          * `OUTRO` - Outro Documento
      - in: query
        name: student
        schema:
          type: integer
          title: User account
      - in: query
        name: validation_status
        schema:
          type: string
          enum:
          - APPROVED
          - PENDING
          - REJECTED
        description: |-
          Status da validação do documento pela secretaria.

          * `PENDING` - Pendente de Validação
          * `APPROVED` - Aprovado
          * `REJECTED` - Rejeitado
      tags:
      - students
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentDocument'
          description: ''

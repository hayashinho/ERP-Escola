openapi: 3.0.3
info:
  title: ERP Escolar API
  version: 1.0.0
  description: API para o Sistema de Gestão Escolar (ERP Escolar)
paths:
  /api/academics/announcements/:
    get:
      operationId: academics_announcements_list
      description: |-
        Provides administrative management of school-wide or targeted announcements.

        **Permissions:** Requires admin user status. (Teachers might create if rules are relaxed).

        **Supported Actions:**
        - Standard CRUD operations for announcements.
        - Author is automatically set to the logged-in user on creation.
        - Supports targeting by user types, grade levels, school classes, or school-wide.
        - Filtering by various fields including dates, author, and targeting parameters.
      parameters:
      - in: query
        name: author
        schema:
          type: integer
      - in: query
        name: expiry_date__date__gte
        schema:
          type: string
          format: date
      - in: query
        name: expiry_date__date__lte
        schema:
          type: string
          format: date
      - in: query
        name: expiry_date__isnull
        schema:
          type: boolean
      - in: query
        name: is_school_wide
        schema:
          type: boolean
      - in: query
        name: publication_date__date__gte
        schema:
          type: string
          format: date
      - in: query
        name: publication_date__date__lte
        schema:
          type: string
          format: date
      - in: query
        name: target_grade_levels
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - in: query
        name: target_school_classes
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      tags:
      - academics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
          description: ''
    post:
      operationId: academics_announcements_create
      description: |-
        Provides administrative management of school-wide or targeted announcements.

        **Permissions:** Requires admin user status. (Teachers might create if rules are relaxed).

        **Supported Actions:**
        - Standard CRUD operations for announcements.
        - Author is automatically set to the logged-in user on creation.
        - Supports targeting by user types, grade levels, school classes, or school-wide.
        - Filtering by various fields including dates, author, and targeting parameters.
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Announcement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Announcement'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''

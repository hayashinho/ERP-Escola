            schema:
              $ref: '#/components/schemas/PatchedStudentDocument'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStudentDocument'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDocument'
          description: ''
  /api/students/admin/student-management/:
    get:
      operationId: students_admin_student_management_list
      description: |-
        Provides administrative management of student records by Secretaria/staff.

        **Permissions:** Requires admin user status (or specific 'Secretaria' group).

        **Supported Actions:**
        - `list`: Retrieves a list of all students. Supports filtering by `registration_status` and `grade_level_pretended`.
        - `retrieve`: Gets details of a specific student.
        - `partial_update` (PATCH): Updates specific fields of a student record (e.g., `registration_status`, `allergies`, `observations`, `rejection_reason`).
          Refer to `StudentSerializer` for updatable fields.

        Direct creation (POST), full update (PUT), and deletion (DELETE) are typically not performed
        through this endpoint, but through more specific processes like pre-registration or enrollment actions.
      parameters:
      - in: query
        name: grade_level_pretended
        schema:
          type: integer
      - in: query
        name: registration_status
        schema:
          type: string
          enum:
          - ACTIVE
          - GRADUATED
          - INACTIVE
          - PENDING_VALIDATION
          - PRE_REGISTERED
          - REJECTED
          - TRANSFERRED
        description: |-
          Status atual do cadastro/matrícula do aluno.

          * `PRE_REGISTERED` - Pré-Cadastrado
          * `PENDING_VALIDATION` - Pendente de Validação
          * `ACTIVE` - Ativo
          * `INACTIVE` - Inativo
          * `TRANSFERRED` - Transferido
          * `GRADUATED` - Graduado
          * `REJECTED` - Rejeitado
      tags:
      - students
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
          description: ''
  /api/students/admin/student-management/{user}/:
    get:
      operationId: students_admin_student_management_retrieve
      description: |-
        Provides administrative management of student records by Secretaria/staff.

        **Permissions:** Requires admin user status (or specific 'Secretaria' group).

        **Supported Actions:**
        - `list`: Retrieves a list of all students. Supports filtering by `registration_status` and `grade_level_pretended`.
        - `retrieve`: Gets details of a specific student.
        - `partial_update` (PATCH): Updates specific fields of a student record (e.g., `registration_status`, `allergies`, `observations`, `rejection_reason`).
          Refer to `StudentSerializer` for updatable fields.

        Direct creation (POST), full update (PUT), and deletion (DELETE) are typically not performed
        through this endpoint, but through more specific processes like pre-registration or enrollment actions.
      parameters:
      - in: path
        name: user
        schema:
          type: integer
          title: User account
        description: A unique value identifying this Student.
        required: true
      tags:
      - students
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          description: ''
    patch:
      operationId: students_admin_student_management_partial_update
      description: |-
        Provides administrative management of student records by Secretaria/staff.

        **Permissions:** Requires admin user status (or specific 'Secretaria' group).

        **Supported Actions:**
        - `list`: Retrieves a list of all students. Supports filtering by `registration_status` and `grade_level_pretended`.
        - `retrieve`: Gets details of a specific student.
        - `partial_update` (PATCH): Updates specific fields of a student record (e.g., `registration_status`, `allergies`, `observations`, `rejection_reason`).
          Refer to `StudentSerializer` for updatable fields.

        Direct creation (POST), full update (PUT), and deletion (DELETE) are typically not performed
        through this endpoint, but through more specific processes like pre-registration or enrollment actions.
      parameters:
      - in: path
        name: user
        schema:
          type: integer
          title: User account
        description: A unique value identifying this Student.
        required: true
      tags:

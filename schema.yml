  /api/auditing/logs/:
    get:
      operationId: auditing_logs_list
      description: |-
        Provides read-only access to AuditLog entries.

        Audit logs record various actions performed within the system, such as user logins,
        object creations, updates, deletions, and specific view accesses.

        **Permissions:** Requires admin user status.

        **Supported Actions:**
        - `list`: Retrieve a paginated list of audit log entries.
          Supports extensive filtering (by user, action type, timestamp, IP, target model, etc.)
          and searching across multiple fields.
        - `retrieve`: Get details of a specific audit log entry by its ID.

        All data is read-only as audit logs are immutable once created.
      parameters:
      - in: query
        name: action_type
        schema:
          type: string
          enum:
          - CREATED
          - DELETED
          - EXPORTED
          - LOGIN_FAILED
          - LOGIN_SUCCESS
          - LOGOUT
          - UPDATED
          - VIEWED
        description: |-
          * `LOGIN_SUCCESS` - Login Successful
          * `LOGIN_FAILED` - Login Failed
          * `LOGOUT` - Logout
          * `CREATED` - Object Created
          * `UPDATED` - Object Updated
          * `DELETED` - Object Deleted
          * `VIEWED` - Object/View Accessed
          * `EXPORTED` - Data Exported
      - in: query
        name: action_type__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: ip_address
        schema:
          type: string
      - in: query
        name: ip_address__startswith
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_content_type__app_label
        schema:
          type: string
      - in: query
        name: target_content_type__model
        schema:
          type: string
      - in: query
        name: target_object_id
        schema:
          type: string
      - in: query
        name: timestamp__date
        schema:
          type: string
          format: date
      - in: query
        name: timestamp__day
        schema:
          type: number
      - in: query
        name: timestamp__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: timestamp__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: timestamp__month
        schema:
          type: number
      - in: query
        name: timestamp__range
        schema:
          type: array
          items:
            type: string
            format: date-time
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: timestamp__year
        schema:
          type: number
      - in: query
        name: user__email
        schema:
          type: string
      - in: query
        name: user__email__icontains
        schema:
          type: string
      - in: query
        name: user__username
        schema:
          type: string
      - in: query
        name: user__username__icontains
        schema:
          type: string
      tags:
      - auditing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''

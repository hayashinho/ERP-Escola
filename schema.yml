    Message:
      type: object
      description: |-
        Serializer for individual messages.
        Sender and thread are typically set by the view logic, not direct client input here.
        'read_by' is managed by system based on access.
      properties:
        id:
          type: integer
          readOnly: true
        thread:
          type: integer
          description: ID of the thread this message belongs to. Required when replying
            directly to a thread if not set by URL.
        sender:
          allOf:
          - $ref: '#/components/schemas/MessageUser'
          readOnly: true
          description: The user who sent the message. Set by the system.
        content:
          type: string
          description: Text content of the message.
        timestamp:
          type: string
          format: date-time
          readOnly: true
        read_by:
          type: array
          items:
            $ref: '#/components/schemas/MessageUser'
          readOnly: true
          description: List of users who have read this message.
      required:
      - content
      - id
      - read_by
      - sender
      - thread
      - timestamp
    MessageThreadCreate:
      type: object
      description: Serializer for creating a new message thread along with its initial
        message.
      properties:
        recipients:
          type: array
          items:
            type: integer
            description: User ID of a recipient.
          writeOnly: true
          description: A list of user IDs for the recipients of the initial message.
        content:
          type: string
          writeOnly: true
          description: The content of the initial message.
        subject:
          type: string
          writeOnly: true
          description: An optional subject for the new message thread.
          maxLength: 255
      required:
      - content
      - recipients
    MessageThreadDetail:
      type: object
      description: |-
        Serializer for the detailed view of a message thread.
        Primarily shows participants and subject. Messages are typically handled by a separate endpoint.
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          type: string
          readOnly: true
          description: Subject of the message thread, if any.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/MessageUser'
          readOnly: true
          description: List of users participating in this thread.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of when the thread was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of the last activity in the thread.
      required:
      - created_at
      - id
      - participants
      - subject
      - updated_at
    MessageThreadList:
      type: object
      description: |-
        Serializer for listing message threads with summary information.
        Includes details like the last message, unread count for the current user,
        and information about other participants if the subject is empty.
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          type: string
          readOnly: true
          description: Subject of the message thread, if any.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/MessageUser'
          readOnly: true
          description: List of users participating in this thread.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of when the thread was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of the last activity in the thread (e.g., new message).
        last_message:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
          description: A snippet of the last message in the thread, including sender
            and timestamp.
        unread_count:
          type: integer
          readOnly: true
          description: Number of unread messages for the current authenticated user
            in this thread.
        first_participant_for_subject:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
          description: If the thread has no subject, this provides details of the
            first other participant to help identify the chat (e.g., 'Chat with User
            X').
      required:
      - created_at
      - first_participant_for_subject
      - id
      - last_message
      - participants
      - subject
      - unread_count
      - updated_at
    MessageUser:
      type: object
      description: Serializer for basic user representation in messaging.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        full_name:
          type: string
          readOnly: true
          description: Full name of the user.
      required:
      - full_name
      - id
      - username
    PatchedAnnouncement:

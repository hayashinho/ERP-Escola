            $ref: '#/components/schemas/SchoolClassList'
          readOnly: true
          description: Detailed list of targeted school classes.
        is_school_wide:
          type: boolean
          default: false
          description: If true, targets all users in the school, overriding other
            target fields.
        expiry_date:
          type: string
          format: date-time
          nullable: true

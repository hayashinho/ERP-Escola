  /api/academics/dashboard/summary/:
    get:
      operationId: academics_dashboard_summary_retrieve
      description: |-
        Provides a cached summary of key indicators for an administrative dashboard.
        This endpoint is read-only.

        **Permissions:** Requires admin user status.

        **Cache:** Results are cached for 5 minutes.

        **Response Data Structure:**
        Refer to `DashboardSummaryDataSerializer` in `apps.academics.serializers` for the detailed structure.
        Includes counts like total active students, students by grade level, pre-registered students, etc.
      tags:
      - academics
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/academics/enrollments/:
    get:
      operationId: academics_enrollments_list
      description: |-
        Provides administrative management of student enrollments in school classes.

        **Permissions:** Requires admin user status (or specific 'Secretaria' group).

        **Supported Actions:**
        - `list`: Retrieve enrollments. Supports extensive filtering (see `filterset_fields`).
        - `create`: Enroll a student in a class. Validates student status and school year activity.
                   Prevents duplicate active enrollments in the same school year.
        - `retrieve`: Get details of a specific enrollment.
        - `partial_update` (PATCH): Update an enrollment, typically its `status`.
                                    Student and school class cannot be changed post-creation.
        - `destroy`: Delete an enrollment. (Caution: Consider impact on related records like grades/attendance).
      parameters:
      - in: query
        name: enrollment_date
        schema:
          type: string
          format: date
      - in: query
        name: enrollment_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: enrollment_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: school_class
        schema:
          type: integer
      - in: query
        name: school_class__grade_level
        schema:
          type: integer
      - in: query
        name: school_class__grade_level__name
        schema:
          type: string
      - in: query
        name: school_class__grade_level__name__icontains
        schema:
          type: string
      - in: query
        name: school_class__school_year
        schema:
          type: integer
      - in: query
        name: school_class__school_year__year
        schema:
          type: integer
      - in: query
        name: school_class__school_year__year__gte
        schema:
          type: integer
      - in: query
        name: school_class__school_year__year__lte
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - DROPPED_OUT
          - TRANSFERRED_OUT
        description: |-
          Status atual da matrícula do aluno na turma.

          * `ACTIVE` - Ativa
          * `COMPLETED` - Concluída
          * `TRANSFERRED_OUT` - Transferido (Saída)
          * `DROPPED_OUT` - Abandono/Evasão
      - in: query
        name: student
        schema:
          type: integer
          title: User account
      - in: query
        name: student__user__username
        schema:
          type: string
      - in: query
        name: student__user__username__icontains
        schema:
          type: string
      tags:
      - academics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enrollment'
          description: ''
    post:
      operationId: academics_enrollments_create
      description: |-
        Provides administrative management of student enrollments in school classes.

        **Permissions:** Requires admin user status (or specific 'Secretaria' group).

        **Supported Actions:**
        - `list`: Retrieve enrollments. Supports extensive filtering (see `filterset_fields`).
        - `create`: Enroll a student in a class. Validates student status and school year activity.
                   Prevents duplicate active enrollments in the same school year.
        - `retrieve`: Get details of a specific enrollment.
        - `partial_update` (PATCH): Update an enrollment, typically its `status`.
                                    Student and school class cannot be changed post-creation.
        - `destroy`: Delete an enrollment. (Caution: Consider impact on related records like grades/attendance).
      tags:

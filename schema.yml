          readOnly: true
          nullable: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
          nullable: true
        student_registration_status:
          type: string
          readOnly: true
        student_enrollment_date:
          type: string
          format: date
          readOnly: true
          description: Student's initial enrollment date in the school.
        current_grade_level_name:
          type: string
          readOnly: true
          nullable: true
          description: Current grade level name, derived from active enrollment in
            the specified school year.
        active_enrollment_school_year:
          type: integer
          readOnly: true
          nullable: true
          description: School year of the active enrollment used for determining current
            grade level.
      required:
      - active_enrollment_school_year
      - cpf
      - current_grade_level_name
      - date_of_birth
      - email
      - full_name
      - student_enrollment_date
      - student_registration_status
      - user_id
      - username
    StudentSimple:
      type: object
      description: |-
        Simplified serializer for the Student model, focused on identification.
        Useful for lists or dropdowns where only basic student info is needed.
      properties:
        user:
          type: integer
          title: User account
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
      - full_name
      - user
    Subject:
      type: object
      description: |-
        Serializer for the Subject model.
        Represents an academic subject taught in the school.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name of the subject (e.g., Mathematics, History).
          maxLength: 100
        description:
          type: string
          description: Optional description of the subject.
      required:
      - id
      - name
    TeacherAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        teacher:
          type: integer
          description: Professor atribuído.
        teacher_info:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        school_class:
          type: integer
        school_class_info:
          allOf:
          - $ref: '#/components/schemas/SchoolClassList'
          readOnly: true
        subject:
          type: integer
        subject_info:
          allOf:
          - $ref: '#/components/schemas/Subject'
          readOnly: true
        school_year:
          type: integer
          description: Ano letivo para o qual esta atribuição é válida.
        school_year_info:
          allOf:
          - $ref: '#/components/schemas/SchoolYear'
          readOnly: true
      required:
      - id
      - school_class
      - school_class_info
      - school_year
      - school_year_info
      - subject
      - subject_info
      - teacher
      - teacher_info
    TokenBlacklist:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      description: |-
        Serializer para o modelo User customizado.
        Inclui campos selecionados do User e o UserProfile aninhado (somente leitura).
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          description: |-
            Designates the role of the user in the system.

            * `PARENT` - Parent
            * `STUDENT` - Student
            * `TEACHER` - Teacher
            * `STAFF` - Staff
            * `ADMIN` - Admin
        profile:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
      required:
      - id
      - profile
      - username
    UserEmail:
      type: object
      description: |-
        Serializer for managing User emails.
        Allows viewing user details and updating the email field.
        Other fields are read-only.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          description: User's email address. This field is updatable.
        user_type:
          type: string
          description: Type of user account (e.g., STUDENT, TEACHER). Read-only.
      required:
      - email
      - first_name
      - id
      - last_name
      - user_type
      - username
    UserManagement:
      type: object
      description: |-
        Serializer for User model for management by Direção/Admin.
        Handles creation, update (specific fields), and detailed display of User accounts.
        Designed for use by administrative users (e.g., Direção).
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Username. Required for new users. Cannot be changed after creation
            via this endpoint.
        email:
          type: string
          format: email
          description: User's email address. Must be unique.
        first_name:
          type: string
          description: User's first name (optional).
        last_name:
          type: string
          description: User's last name (optional).
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          description: |-
            Type of user account. Determines permissions and role.

            * `PARENT` - Parent
            * `STUDENT` - Student
            * `TEACHER` - Teacher
            * `STAFF` - Staff
            * `ADMIN` - Admin
        user_type_display:
          type: string
          readOnly: true
          description: Verbose display name for the user type.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site (e.g.,
            access Django Admin).
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them. Use with caution.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        password:
          type: string
          writeOnly: true
          description: User's password. Required for new users. Not readable. Not
            updatable for existing users via this endpoint.
      required:
      - date_joined
      - email
      - id
      - last_login
      - password
      - user_type
      - user_type_display
      - username
    UserProfile:
      type: object
      description: |-
        Serializer para o modelo UserProfile.
        Inclui todos os campos do modelo.
      properties:
        user:
          type: integer
        cpf:
          type: string
          nullable: true
          description: 'Formato: XXX.XXX.XXX-XX'
          maxLength: 14
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
          maxLength: 20
      required:
      - user
    UserTypeEnum:
      enum:
      - PARENT
      - STUDENT
      - TEACHER
      - STAFF
      - ADMIN
      type: string
      description: |-
        * `PARENT` - Parent
        * `STUDENT` - Student
        * `TEACHER` - Teacher
        * `STAFF` - Staff
        * `ADMIN` - Admin
    ValidationStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pendente de Validação
        * `APPROVED` - Aprovado
        * `REJECTED` - Rejeitado
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

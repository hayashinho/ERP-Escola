  /api/students/pre-register/:
    post:
      operationId: students_pre_register_create
      description: |-
        Handles the public pre-registration process for new students.

        This endpoint is publicly accessible and expects a multipart/form-data payload
        due to file uploads for student documents.

        **Key Expected Payload Fields:**
        - `parent_user_data` (JSON string or form fields): Data for the parent's User account (e.g., username, email, password).
        - `parent_profile_data` (JSON string or form fields): Data for the parent's UserProfile (e.g., CPF, address).
        - `parent_relationship_type` (string): Relationship of the parent to the student (e.g., 'MOTHER', 'FATHER').
        - `student_user_data` (JSON string or form fields): Data for the student's User account.
        - `student_profile_data` (JSON string or form fields): Data for the student's UserProfile.
        - `student_data` (JSON string or form fields): Data for the Student record itself (e.g., `grade_level_pretended_id`, `allergies`).
            - `grade_level_pretended_id` (integer, required in `student_data`): ID of the GradeLevel the student is applying for.
        - `document_types` (list of strings): List of document types being uploaded (e.g., ['RG', 'CPF_STUDENT']). Must match `document_files`.
        - `document_files` (list of files): List of uploaded document files. Must match `document_types`.

        **On Success (HTTP 201 Created):**
        Returns a success message with IDs of created entities.

        **On Failure (HTTP 400 Bad Request or 500 Internal Server Error):**
        Returns an error message detailing the issue.
      tags:
      - students
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/students/reports/student-list/csv/:
    get:
      operationId: students_reports_student_list_csv_list
      description: |-
        API View to export a list of students to a CSV file.

        **Permissions:** Requires admin user status.

        **Supported Query Parameters for Filtering:**
        - `grade_level_id` (integer): Filter students by their current enrolled grade level ID (based on active enrollment in `school_year_id` if provided).
        - `registration_status` (string): Filter students by their registration status (e.g., 'ACTIVE', 'PRE_REGISTERED').
        - `school_year_id` (integer): Specify the school year context for determining 'current_grade_level_name' and 'active_enrollment_school_year' annotations.
                                     If provided, `grade_level_id` filter will apply to enrollments within this school year.

        The output CSV includes student details, profile information, and annotated enrollment data.
      tags:
      - students
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentReport'
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/blacklist/:
    post:
      operationId: token_blacklist_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    ActionTypeEnum:
      enum:
      - LOGIN_SUCCESS
      - LOGIN_FAILED
      - LOGOUT
      - CREATED
      - UPDATED
      - DELETED
      - VIEWED
      - EXPORTED
      type: string
      description: |-
        * `LOGIN_SUCCESS` - Login Successful
        * `LOGIN_FAILED` - Login Failed
        * `LOGOUT` - Logout
        * `CREATED` - Object Created
        * `UPDATED` - Object Updated
        * `DELETED` - Object Deleted
        * `VIEWED` - Object/View Accessed
        * `EXPORTED` - Data Exported
    Announcement:
      type: object
      description: |-
        Serializer for Announcements.
        Handles creation, update, and display of announcements with various targeting options.
        The 'author' field is automatically set to the logged-in user in the ViewSet.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          description: Title of the announcement.
          maxLength: 255
        content:
          type: string
          description: Main content of the announcement.
        publication_date:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the announcement was published (system-set).
        author:
          type: integer
          readOnly: true
          nullable: true
        author_details:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
          description: Details of the user who authored the announcement.
        target_user_types:
          nullable: true
          description: Optional. List of user type strings (e.g., ["PARENT", "STUDENT"])
            to target. Ignored if 'is_school_wide' is true.
        target_grade_levels:
          type: array
          items:
            type: integer
          description: Optional. List of Grade Level IDs to target. Ignored if 'is_school_wide'
            is true.
        target_grade_levels_details:
          type: array
          items:
            $ref: '#/components/schemas/GradeLevel'
          readOnly: true
          description: Detailed list of targeted grade levels.
        target_school_classes:
          type: array
          items:
            type: integer
          description: Optional. List of School Class IDs to target. Ignored if 'is_school_wide'
            is true.
        target_school_classes_details:
          type: array
          items:
            $ref: '#/components/schemas/SchoolClassList'
          readOnly: true
          description: Detailed list of targeted school classes.
        is_school_wide:
          type: boolean
          default: false
          description: If true, targets all users in the school, overriding other
            target fields.
        expiry_date:
          type: string
          format: date-time
          nullable: true
          description: Optional. Date and time after which the announcement should
            no longer be considered active.
      required:
      - author
      - author_details
      - content
      - id
      - publication_date
      - target_grade_levels_details
      - target_school_classes_details
      - title
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        enrollment:
          type: integer
        student_name:
          type: string
          readOnly: true
        subject:
          type: integer
        subject_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          description: Data da aula para a qual a frequência está sendo registrada.
        status:
          allOf:
          - $ref: '#/components/schemas/Status2c9Enum'
          description: |-
            Status de presença do aluno na aula.

            * `PRESENT` - Presente
            * `ABSENT` - Ausente
            * `JUSTIFIED_ABSENCE` - Ausência Justificada
        status_display:
          type: string
          readOnly: true
        notes:
          type: string
          nullable: true
          description: Observações, como a justificativa para uma ausência.
      required:
      - enrollment
      - id
      - status
      - status_display
      - student_name
      - subject
      - subject_name
    AttendanceWrite:
      type: object
      properties:
        enrollment:
          type: integer
        subject:
          type: integer
        date:
          type: string
          format: date
          description: Data da aula para a qual a frequência está sendo registrada.
        status:
          allOf:
          - $ref: '#/components/schemas/Status2c9Enum'
          description: |-
            Status de presença do aluno na aula.

            * `PRESENT` - Presente
            * `ABSENT` - Ausente
            * `JUSTIFIED_ABSENCE` - Ausência Justificada
        notes:
          type: string
          nullable: true
          description: Observações, como a justificativa para uma ausência.
      required:
      - enrollment
      - status
      - subject
    AuditLog:
      type: object
      description: |-
        Serializer for AuditLog entries, providing detailed read-only information.
        Used for displaying audit logs. All fields are read-only as logs are immutable.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/AuditLogUser'
          readOnly: true
          description: The user who performed the action, if authenticated and available.
        action_type:
          allOf:
          - $ref: '#/components/schemas/ActionTypeEnum'
          readOnly: true
        action_type_display:
          type: string
          readOnly: true
          description: Human-readable description of the action performed.
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the action occurred.
        ip_address:
          type: string
          readOnly: true
          description: IP address from which the action was initiated, if available.
        target_content_type:
          allOf:
          - $ref: '#/components/schemas/ContentType'
          readOnly: true
          description: The content type (model) of the object that was acted upon,
            if any.
        target_object_id:
          type: string
          readOnly: true
          description: Primary key of the target object, if any.
        target_object_repr:
          type: string
          readOnly: true
          description: String representation of the target object at the time of logging,
            if any.
        details:
          readOnly: true
          description: A JSON object containing additional, action-specific details
            about the logged event.
      required:
      - action_type
      - action_type_display
      - details
      - id
      - ip_address
      - target_content_type
      - target_object_id
      - target_object_repr
      - timestamp
      - user
    AuditLogUser:
      type: object
      description: Simplified User serializer for audit log display.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
      required:
      - id
      - username
    ContentType:
      type: object
      description: Serializer for ContentType model, showing app label and model name.
      properties:
        id:
          type: integer
          readOnly: true
        app_label:
          type: string
          maxLength: 100
        model:
          type: string
          title: Python model class name
          maxLength: 100
      required:
      - app_label
      - id
      - model
    DidacticMaterial:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          description: Título do material didático.
          maxLength: 200
        description:
          type: string
          nullable: true
          description: Breve descrição do material.
        file:
          type: string
          format: uri
          description: Arquivo do material didático (PDF, DOCX, PPTX, etc.).
        file_url:
          type: string
          nullable: true
          readOnly: true
          description: URL to access the material file.
        subject:
          type: integer
        subject_name:
          type: string
          readOnly: true
          description: Name of the subject.
        school_class:
          type: integer
          nullable: true
          description: Associe a uma turma específica, ou deixe em branco se for geral
            para a disciplina/série.
        school_class_name:
          type: string
          readOnly: true
          nullable: true
          description: Name of the school class, if specific.
        uploader:
          type: integer
          nullable: true
          description: Usuário que fez o upload do material (Professor, Secretaria,
            Admin).
        uploader_info:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
          description: Details of the user who uploaded the material.
        upload_date:
          type: string
          format: date-time
          readOnly: true
          description: Data e hora em que o material foi enviado.
      required:
      - file
      - file_url
      - id
      - school_class_name
      - subject
      - subject_name
      - title
      - upload_date
      - uploader_info
    DidacticMaterialWrite:
      type: object
      description: Serializer para criação e atualização de Materiais Didáticos (DidacticMaterial).
      properties:
        title:
          type: string
          description: Título do material didático.
          maxLength: 200
        description:
          type: string
          nullable: true
          description: Breve descrição do material.
        file:
          type: string
          format: uri
          description: Arquivo do material didático (PDF, DOCX, PPTX, etc.).
        subject:
          type: integer
        school_class:
          type: integer
          nullable: true
      required:
      - file
      - subject
      - title
    DocumentTypeEnum:
      enum:
      - RG_ALUNO
      - CPF_ALUNO
      - COMP_RESIDENCIA_RESP
      - CARTEIRA_VACINACAO
      - HIST_ESCOLAR
      - LAUDO_MEDICO
      - FOTO_3X4
      - RG_RESPONSAVEL
      - CPF_RESPONSAVEL
      - DECLARACAO_QUITACAO_ESCOLA_ANT
      - OUTRO
      type: string
      description: |-
        * `RG_ALUNO` - RG do Aluno
        * `CPF_ALUNO` - CPF do Aluno
        * `COMP_RESIDENCIA_RESP` - Comprovante de Residência do Responsável
        * `CARTEIRA_VACINACAO` - Carteira de Vacinação
        * `HIST_ESCOLAR` - Histórico Escolar da Escola Anterior
        * `LAUDO_MEDICO` - Laudo Médico (para necessidades especiais)
        * `FOTO_3X4` - Foto 3x4 Recente
        * `RG_RESPONSAVEL` - RG do Responsável
        * `CPF_RESPONSAVEL` - CPF do Responsável
        * `DECLARACAO_QUITACAO_ESCOLA_ANT` - Declaração de Quitação da Escola Anterior
        * `OUTRO` - Outro Documento
    Enrollment:
      type: object
      description: |-
        Serializer for student Enrollments.
        Handles creation of new enrollments and updating the status of existing ones.
        Student and School Class cannot be changed after an enrollment is created.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
          title: User account
          writeOnly: true
          description: ID of the student to be enrolled. Student must have an 'ACTIVE'
            registration status.
        student_details:
          allOf:
          - $ref: '#/components/schemas/StudentSimple'
          readOnly: true
          description: Basic details of the enrolled student.
        school_class:
          type: integer
          writeOnly: true
          description: ID of the school class to enroll the student into. Class must
            belong to an active school year.
        school_class_details:
          allOf:
          - $ref: '#/components/schemas/SchoolClassList'
          readOnly: true
          description: Basic details of the class the student is enrolled in.
        enrollment_date:
          type: string
          format: date
          readOnly: true
          description: Date the enrollment was recorded. Automatically set on creation
            if not provided, but generally read-only post-creation.
        status:
          allOf:
          - $ref: '#/components/schemas/EnrollmentStatusEnum'
          default: ACTIVE
          description: |-
            Status of the enrollment. Defaults to 'Active' upon creation. Can be updated to 'Completed', 'Transferred Out', or 'Dropped Out'.

            * `ACTIVE` - Ativa
            * `COMPLETED` - Concluída
            * `TRANSFERRED_OUT` - Transferido (Saída)
            * `DROPPED_OUT` - Abandono/Evasão
        status_display:
          type: string
          readOnly: true
          description: Display name for the enrollment status.
      required:
      - enrollment_date
      - id
      - school_class
      - school_class_details
      - status_display
      - student
      - student_details
    EnrollmentReport:
      type: object
      description: |-
        Serializer for generating a CSV report of enrollments.
        Flattens related data for student, class, grade level, and school year.
      properties:
        enrollment_id:
          type: integer
          readOnly: true
          description: Unique ID of the enrollment record.
        student_name:
          type: string
          readOnly: true
          description: Full name of the enrolled student.
        student_username:
          type: string
          readOnly: true
          description: Username of the enrolled student.
        school_class_name:
          type: string
          readOnly: true
          description: Name of the class.
        grade_level_name:
          type: string
          readOnly: true
          description: Name of the grade level of the class.
        school_year:
          type: integer
          readOnly: true
          description: Academic year of the enrollment.
        enrollment_status:
          type: string
          readOnly: true
          description: Current status of the enrollment (e.g., Active, Completed).
        enrollment_date:
          type: string
          format: date
          readOnly: true
          description: Date when the enrollment was made.
      required:
      - enrollment_date
      - enrollment_id
      - enrollment_status
      - grade_level_name
      - school_class_name
      - school_year
      - student_name
      - student_username
    EnrollmentStatusEnum:
      enum:
      - ACTIVE
      - COMPLETED
      - TRANSFERRED_OUT
      - DROPPED_OUT
      type: string
      description: |-
        * `ACTIVE` - Ativa
        * `COMPLETED` - Concluída
        * `TRANSFERRED_OUT` - Transferido (Saída)
        * `DROPPED_OUT` - Abandono/Evasão
    EventTypeEnum:
      enum:
      - EXAM
      - MEETING
      - HOLIDAY
      - SCHOOL_ACTIVITY
      - OTHER
      type: string
      description: |-
        * `EXAM` - Prova/Avaliação
        * `MEETING` - Reunião
        * `HOLIDAY` - Feriado/Recesso
        * `SCHOOL_ACTIVITY` - Atividade Escolar
        * `OTHER` - Outro Evento
    Fee:
      type: object
      description: |-
        Read-only serializer for Fee details.
        Includes calculated fields like student name, school year string representation,
        status display, overdue status, and total value.
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
          title: User account
          readOnly: true
          description: ID of the student associated with this fee.
        student_name:
          type: string
          nullable: true
          readOnly: true
          description: Full name of the student.
        school_year:
          type: integer
          readOnly: true
          description: ID of the school year this fee pertains to.
        school_year_str:
          type: string
          readOnly: true
          description: String representation of the school year (e.g., '2023-2024').
        description:
          type: string
          readOnly: true
          description: Description of the fee (e.g., Monthly Fee, Material Fee).
        due_date:
          type: string
          format: date
          readOnly: true
          description: Date when the fee is due.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Base amount of the fee.
        status:
          type: string
          readOnly: true
          description: Current status of the fee (e.g., PENDING, PAID).
        status_display:
          type: string
          readOnly: true
          description: Display name for the fee status.
        payment_gateway_id:
          type: string
          readOnly: true
          nullable: true
          description: Optional ID from an external payment gateway.
        barcode:
          type: string
          readOnly: true
          nullable: true
          description: Barcode for payment slip, if applicable.
        notes:
          type: string
          readOnly: true
          nullable: true
          description: Administrative notes regarding this fee.
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Amount of discount applied to this fee.
        penalty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Penalty amount for late payment, if any.
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Total amount paid towards this fee so far.
        payment_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Date when the fee was fully or partially paid.
        is_overdue:
          type: boolean
          readOnly: true
          description: True if the fee is past its due date and not fully paid.
        total_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Calculated total value of the fee (amount - discount + penalty).
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of fee creation.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of last fee update.
      required:
      - amount
      - amount_paid
      - barcode
      - created_at
      - description
      - discount_amount
      - due_date
      - id
      - is_overdue
      - notes
      - payment_date
      - payment_gateway_id
      - penalty_amount
      - school_year
      - school_year_str
      - status
      - status_display
      - student
      - student_name
      - total_value
      - updated_at
    FeeWrite:
      type: object
      description: |-
        Serializer for creating and updating Fee records.
        Includes a field for edit reason when updating.
      properties:
        student:
          type: integer
          title: User account
          description: ID of the student this fee applies to.
        school_year:
          type: integer
          description: ID of the school year for this fee.
        description:
          type: string
          description: Description of the fee.
          maxLength: 255
        due_date:
          type: string
          format: date
          description: Date when the fee is due.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Base amount of the fee.
        status:
          allOf:
          - $ref: '#/components/schemas/FeeWriteStatusEnum'
          description: |-
            Current status of the fee.

            * `PENDING` - Pendente
            * `PAID` - Pago
            * `OVERDUE` - Vencido
            * `CANCELED` - Cancelado
            * `PARTIALLY_PAID` - Parcialmente Pago
        notes:
          type: string
          description: Optional administrative notes.
        payment_gateway_id:
          type: string
          description: Optional ID from an external payment gateway.
          maxLength: 100
        barcode:
          type: string
          description: Optional barcode for payment slip.
          maxLength: 255
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '0.00'
          description: Amount of discount. Defaults to 0.
        penalty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '0.00'
          description: Penalty for late payment. Defaults to 0.
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '0.00'
          description: Amount already paid. Defaults to 0.
        payment_date:
          type: string
          format: date
          nullable: true
          description: Date of last payment, if any.
        edit_reason:
          type: string
          writeOnly: true
          title: Motivo da Edição
          description: Reason for editing the fee, required for updates if changes
            are significant.
      required:
      - amount
      - description
      - due_date
      - school_year
      - status
      - student
    FeeWriteStatusEnum:

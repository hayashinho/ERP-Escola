        schema:
          type: string
          format: date
      - in: query
        name: target_grade_levels
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - in: query
        name: target_school_classes
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      tags:

  /api/academics/enrollments/:
    get:
      operationId: academics_enrollments_list
      description: |-
        ViewSet for managing Student Enrollments in SchoolClasses.
        Allows creation, update (status), listing, and retrieval.
      parameters:
      - in: query
        name: enrollment_date
        schema:
          type: string
          format: date
      - in: query
        name: enrollment_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: enrollment_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: school_class
        schema:
          type: integer
      - in: query
        name: school_class__grade_level
        schema:
          type: integer
      - in: query
        name: school_class__grade_level__name
        schema:
          type: string
      - in: query
        name: school_class__grade_level__name__icontains
        schema:
          type: string
      - in: query
        name: school_class__school_year
        schema:
          type: integer
      - in: query
        name: school_class__school_year__year
        schema:
          type: integer
      - in: query
        name: school_class__school_year__year__gte
        schema:
          type: integer
      - in: query
        name: school_class__school_year__year__lte
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - DROPPED_OUT
          - TRANSFERRED_OUT
        description: |-
          Status atual da matrícula do aluno na turma.

          * `ACTIVE` - Ativa
          * `COMPLETED` - Concluída
          * `TRANSFERRED_OUT` - Transferido (Saída)
          * `DROPPED_OUT` - Abandono/Evasão
      - in: query
        name: student
        schema:
          type: integer
          title: User account
      - in: query
        name: student__user__username
        schema:
          type: string
      - in: query
        name: student__user__username__icontains
        schema:
          type: string
      tags:
      - academics
      security:

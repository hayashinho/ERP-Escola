  /api/academics/school-years/{id}/batch-reenroll/:
    post:
      operationId: academics_school_years_batch_reenroll_create
      description: |-
        Performs batch re-enrollment of students from this school year (source, identified by pk)
        to a new target school year.

        Expects 'target_school_year_id' in the request data, which is the ID of the SchoolYear
        to which students will be re-enrolled.

        The process involves:
        - Identifying students with 'ACTIVE' or 'COMPLETED' enrollments in the source school year.
        - Determining their next grade level.
        - Finding a suitable SchoolClass in the target school year for that next grade.
          (Note: Currently, it picks the first available class. Automatic class creation is not implemented.)
        - Creating a new 'ACTIVE' Enrollment for the student in the target class/year.
        - Updating the old 'ACTIVE' enrollment to 'COMPLETED'.

        Returns a summary of the operation including counts of processed,
        successfully re-enrolled, and skipped students with reasons.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this School Year.
        required: true
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolYear'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SchoolYear'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SchoolYear'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolYear'
          description: ''

          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          readOnly: true
          description: |-
            Designates the role of the user in the system.

            * `PARENT` - Parent
            * `STUDENT` - Student
            * `TEACHER` - Teacher
            * `STAFF` - Staff
            * `ADMIN` - Admin
      required:
      - first_name
      - id
      - last_name
      - user_type
      - username
    UserManagement:
      type: object
      description: |-
        Serializer for User model for management by Direção/Admin.
        Handles creation, update (specific fields), and detailed display.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Username. Required for new users. Read-only for existing users.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          description: User's email address. Must be unique if provided.
        first_name:
          type: string
          description: User's first name.
        last_name:
          type: string
          description: User's last name.
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          description: |-
            Type of user account.

            * `PARENT` - Parent
            * `STUDENT` - Student
            * `TEACHER` - Teacher
            * `STAFF` - Staff
            * `ADMIN` - Admin
        user_type_display:
          type: string
          readOnly: true
          description: Display name for the user type.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        password:
          type: string
          writeOnly: true
          description: Required for new users. Not updatable via this endpoint for
            existing users.
          maxLength: 128
      required:
      - date_joined
      - id
      - last_login
      - user_type_display
      - username
    UserProfile:
      type: object
      description: |-
        Serializer para o modelo UserProfile.
        Inclui todos os campos do modelo.
      properties:
        user:
          type: integer
        cpf:
          type: string
          nullable: true
          description: 'Formato: XXX.XXX.XXX-XX'
          maxLength: 14
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
          maxLength: 20
      required:
      - user
    UserTypeEnum:
      enum:
      - PARENT
      - STUDENT
      - TEACHER
      - STAFF
      - ADMIN
      type: string
      description: |-
        * `PARENT` - Parent
        * `STUDENT` - Student
        * `TEACHER` - Teacher
        * `STAFF` - Staff
        * `ADMIN` - Admin
    ValidationStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pendente de Validação
        * `APPROVED` - Aprovado
        * `REJECTED` - Rejeitado
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

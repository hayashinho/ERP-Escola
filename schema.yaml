  /api/students/admin/student-document-management/:
    get:
      operationId: students_admin_student_document_management_list
      description: |-
        ViewSet for Secretaria to manage student documents, specifically for validation.
        Allows listing, retrieving, and updating (PATCH) document status and notes.
      parameters:
      - in: query
        name: document_type
        schema:
          type: string
          enum:
          - CARTEIRA_VACINACAO
          - COMP_RESIDENCIA_RESP
          - CPF_ALUNO
          - CPF_RESPONSAVEL
          - DECLARACAO_QUITACAO_ESCOLA_ANT
          - FOTO_3X4
          - HIST_ESCOLAR
          - LAUDO_MEDICO
          - OUTRO
          - RG_ALUNO
          - RG_RESPONSAVEL
        description: |-
          Tipo do documento.

          * `RG_ALUNO` - RG do Aluno
          * `CPF_ALUNO` - CPF do Aluno
          * `COMP_RESIDENCIA_RESP` - Comprovante de Residência do Responsável
          * `CARTEIRA_VACINACAO` - Carteira de Vacinação
          * `HIST_ESCOLAR` - Histórico Escolar da Escola Anterior
          * `LAUDO_MEDICO` - Laudo Médico (para necessidades especiais)
          * `FOTO_3X4` - Foto 3x4 Recente
          * `RG_RESPONSAVEL` - RG do Responsável
          * `CPF_RESPONSAVEL` - CPF do Responsável

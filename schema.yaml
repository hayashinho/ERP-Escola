            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    ActionTypeEnum:
      enum:
      - LOGIN_SUCCESS
      - LOGIN_FAILED
      - LOGOUT
      - CREATED
      - UPDATED
      - DELETED
      - VIEWED
      - EXPORTED
      type: string
      description: |-
        * `LOGIN_SUCCESS` - Login Successful
        * `LOGIN_FAILED` - Login Failed
        * `LOGOUT` - Logout
        * `CREATED` - Object Created
        * `UPDATED` - Object Updated
        * `DELETED` - Object Deleted
        * `VIEWED` - Object/View Accessed
        * `EXPORTED` - Data Exported
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        publication_date:
          type: string
          format: date-time
          readOnly: true
        author:
          type: integer
          readOnly: true
          nullable: true
        author_details:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        target_user_types:
          nullable: true
          description: Optional. List of user type strings (e.g., ["PARENT", "STUDENT"])
            to target.
        target_grade_levels:
          type: array
          items:
            type: integer
          description: Optional. List of Grade Level IDs to target with this announcement.
        target_grade_levels_details:
          type: array
          items:
            $ref: '#/components/schemas/GradeLevel'
          readOnly: true
        target_school_classes:
          type: array
          items:
            type: integer
          description: Optional. List of School Class IDs to target with this announcement.
        target_school_classes_details:
          type: array
          items:
            $ref: '#/components/schemas/SchoolClassList'
          readOnly: true
        is_school_wide:
          type: boolean
          title: Is school-wide?
          description: Marque se o comunicado é para toda a escola (ignora outros
            direcionamentos específicos se marcado).
        expiry_date:
          type: string
          format: date-time
          nullable: true
          description: Data após a qual o comunicado não será mais exibido proeminentemente.
      required:
      - author
      - author_details
      - content
      - id
      - publication_date
      - target_grade_levels_details
      - target_school_classes_details
      - title
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        enrollment:
          type: integer
        student_name:
          type: string
          readOnly: true
        subject:
          type: integer
        subject_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          description: Data da aula para a qual a frequência está sendo registrada.
        status:
          allOf:
          - $ref: '#/components/schemas/Status2c9Enum'
          description: |-
            Status de presença do aluno na aula.

            * `PRESENT` - Presente
            * `ABSENT` - Ausente
            * `JUSTIFIED_ABSENCE` - Ausência Justificada
        status_display:
          type: string
          readOnly: true
        notes:
          type: string
          nullable: true
          description: Observações, como a justificativa para uma ausência.
      required:
      - enrollment
      - id
      - status
      - status_display
      - student_name
      - subject
      - subject_name
    AttendanceWrite:
      type: object
      properties:
        enrollment:
          type: integer
        subject:
          type: integer
        date:
          type: string
          format: date
          description: Data da aula para a qual a frequência está sendo registrada.
        status:
          allOf:
          - $ref: '#/components/schemas/Status2c9Enum'
          description: |-
            Status de presença do aluno na aula.

            * `PRESENT` - Presente
            * `ABSENT` - Ausente
            * `JUSTIFIED_ABSENCE` - Ausência Justificada
        notes:
          type: string
          nullable: true
          description: Observações, como a justificativa para uma ausência.
      required:
      - enrollment
      - status
      - subject
    AuditLog:
      type: object
      description: |-
        Serializer for AuditLog entries, providing detailed read-only information.
        Used for displaying audit logs. All fields are read-only as logs are immutable.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/AuditLogUser'
          readOnly: true
          description: The user who performed the action, if authenticated and available.
        action_type:
          allOf:
          - $ref: '#/components/schemas/ActionTypeEnum'
          readOnly: true
        action_type_display:
          type: string
          readOnly: true
          description: Human-readable description of the action performed.
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the action occurred.
        ip_address:
          type: string
          readOnly: true
          description: IP address from which the action was initiated, if available.
        target_content_type:
          allOf:
          - $ref: '#/components/schemas/ContentType'
          readOnly: true
          description: The content type (model) of the object that was acted upon,
            if any.
        target_object_id:
          type: string
          readOnly: true
          description: Primary key of the target object, if any.
        target_object_repr:
          type: string
          readOnly: true
          description: String representation of the target object at the time of logging,
            if any.
        details:
          readOnly: true
          description: A JSON object containing additional, action-specific details
            about the logged event.
      required:
      - action_type
      - action_type_display
      - details
      - id
      - ip_address
      - target_content_type
      - target_object_id
      - target_object_repr
      - timestamp
      - user
    AuditLogUser:
      type: object
      description: Simplified User serializer for audit log display.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
      required:
      - id
      - username
    ContentType:
      type: object
      description: Serializer for ContentType model, showing app label and model name.
      properties:
        id:
          type: integer
          readOnly: true
        app_label:
          type: string
          maxLength: 100
        model:
          type: string
          title: Python model class name
          maxLength: 100
      required:
      - app_label
      - id
      - model
    DidacticMaterial:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          description: Título do material didático.
          maxLength: 200
        description:
          type: string
          nullable: true
          description: Breve descrição do material.
        file:
          type: string
          format: uri
          description: Arquivo do material didático (PDF, DOCX, PPTX, etc.).
        file_url:
          type: string
          readOnly: true
        subject:
          type: integer
        subject_name:
          type: string
          readOnly: true
        school_class:
          type: integer
          nullable: true
          description: Associe a uma turma específica, ou deixe em branco se for geral
            para a disciplina/série.
        school_class_name:
          type: string
          readOnly: true
          nullable: true
        uploader:
          type: integer
          nullable: true
          description: Usuário que fez o upload do material (Professor, Secretaria,
            Admin).
        uploader_info:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        upload_date:
          type: string
          format: date-time
          readOnly: true
          description: Data e hora em que o material foi enviado.
      required:
      - file
      - file_url
      - id
      - school_class_name
      - subject
      - subject_name
      - title
      - upload_date
      - uploader_info
    DidacticMaterialWrite:
      type: object
      description: Serializer para criação e atualização de Materiais Didáticos (DidacticMaterial).
      properties:
        title:
          type: string
          description: Título do material didático.
          maxLength: 200
        description:
          type: string
          nullable: true
          description: Breve descrição do material.
        file:
          type: string
          format: uri
          description: Arquivo do material didático (PDF, DOCX, PPTX, etc.).
        subject:
          type: integer
        school_class:
          type: integer
          nullable: true
      required:
      - file
      - subject
      - title
    DocumentTypeEnum:
      enum:
      - RG_ALUNO
      - CPF_ALUNO
      - COMP_RESIDENCIA_RESP
      - CARTEIRA_VACINACAO
      - HIST_ESCOLAR
      - LAUDO_MEDICO
      - FOTO_3X4
      - RG_RESPONSAVEL
      - CPF_RESPONSAVEL
      - DECLARACAO_QUITACAO_ESCOLA_ANT
      - OUTRO
      type: string
      description: |-
        * `RG_ALUNO` - RG do Aluno
        * `CPF_ALUNO` - CPF do Aluno
        * `COMP_RESIDENCIA_RESP` - Comprovante de Residência do Responsável
        * `CARTEIRA_VACINACAO` - Carteira de Vacinação
        * `HIST_ESCOLAR` - Histórico Escolar da Escola Anterior
        * `LAUDO_MEDICO` - Laudo Médico (para necessidades especiais)
        * `FOTO_3X4` - Foto 3x4 Recente
        * `RG_RESPONSAVEL` - RG do Responsável
        * `CPF_RESPONSAVEL` - CPF do Responsável
        * `DECLARACAO_QUITACAO_ESCOLA_ANT` - Declaração de Quitação da Escola Anterior
        * `OUTRO` - Outro Documento
    Enrollment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
          title: User account
          writeOnly: true
          description: ID of the student to be enrolled.
        student_details:
          allOf:
          - $ref: '#/components/schemas/StudentSimple'
          readOnly: true
        school_class:
          type: integer
          writeOnly: true
          description: ID of the school class to enroll the student into.
        school_class_details:
          allOf:
          - $ref: '#/components/schemas/SchoolClassList'
          readOnly: true
        enrollment_date:
          type: string
          format: date
          readOnly: true
          description: Data em que a matrícula foi efetivada nesta turma.
        status:
          allOf:
          - $ref: '#/components/schemas/EnrollmentStatusEnum'
          default: ACTIVE
          description: |-
            Status of the enrollment. Defaults to 'Active' upon creation. Can be updated to 'Completed', 'Transferred Out', or 'Dropped Out'.

            * `ACTIVE` - Ativa
            * `COMPLETED` - Concluída
            * `TRANSFERRED_OUT` - Transferido (Saída)
            * `DROPPED_OUT` - Abandono/Evasão
        status_display:
          type: string
          readOnly: true
      required:
      - enrollment_date
      - id
      - school_class
      - school_class_details
      - status_display
      - student
      - student_details
    EnrollmentReport:
      type: object
      properties:
        enrollment_id:
          type: integer
          readOnly: true
        student_name:
          type: string
          readOnly: true
        student_username:
          type: string
          readOnly: true
        school_class_name:
          type: string
          readOnly: true
        grade_level_name:
          type: string
          readOnly: true
        school_year:
          type: integer
          readOnly: true
        enrollment_status:
          type: string
          readOnly: true
        enrollment_date:
          type: string
          format: date
          readOnly: true
          description: Data em que a matrícula foi efetivada nesta turma.
      required:
      - enrollment_date
      - enrollment_id
      - enrollment_status
      - grade_level_name
      - school_class_name
      - school_year
      - student_name
      - student_username
    EnrollmentStatusEnum:
      enum:
      - ACTIVE
      - COMPLETED
      - TRANSFERRED_OUT
      - DROPPED_OUT
      type: string
      description: |-
        * `ACTIVE` - Ativa
        * `COMPLETED` - Concluída
        * `TRANSFERRED_OUT` - Transferido (Saída)
        * `DROPPED_OUT` - Abandono/Evasão
    EventTypeEnum:
      enum:
      - EXAM
      - MEETING
      - HOLIDAY
      - SCHOOL_ACTIVITY
      - OTHER
      type: string
      description: |-
        * `EXAM` - Prova/Avaliação
        * `MEETING` - Reunião
        * `HOLIDAY` - Feriado/Recesso
        * `SCHOOL_ACTIVITY` - Atividade Escolar
        * `OTHER` - Outro Evento
    Fee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
          title: User account
          description: Aluno ao qual esta taxa se refere.
        student_name:
          type: string
          readOnly: true
        school_year:
          type: integer
          description: Ano letivo da taxa.
        school_year_str:
          type: string
          readOnly: true
        description:
          type: string
          description: 'Descrição da taxa (ex: Mensalidade Março/2024, Taxa de Material
            Didático).'
          maxLength: 255
        due_date:
          type: string
          format: date
          description: Data de vencimento.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Valor original da taxa.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusE97Enum'
          description: |-
            Status atual da taxa.

            * `PENDING` - Pendente
            * `PAID` - Pago
            * `OVERDUE` - Vencido
            * `CANCELED` - Cancelado
            * `PARTIALLY_PAID` - Parcialmente Pago
        status_display:
          type: string
          readOnly: true
        payment_gateway_id:
          type: string
          nullable: true
          description: ID externo do boleto/cobrança no gateway de pagamento.
          maxLength: 255
        barcode:
          type: string
          nullable: true
          description: Código de barras do boleto, se aplicável.
          maxLength: 255
        notes:
          type: string
          nullable: true
          description: 'Observações internas sobre a taxa (ex: negociações, isenções
            parciais).'
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Valor do desconto aplicado.
        penalty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Valor da multa por atraso.
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Valor efetivamente pago.
        payment_date:
          type: string
          format: date
          nullable: true
          description: Data em que o pagamento foi efetuado/confirmado.
        is_overdue:
          type: boolean
          readOnly: true
        total_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - description
      - due_date
      - id
      - is_overdue
